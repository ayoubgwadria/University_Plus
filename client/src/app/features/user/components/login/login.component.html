<div class="login-wrapper">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"></path>
            <path d="M21 12c-1 0-3-1-3-3s2-3 3-3 3 1 3 3-2 3-3 3"></path>
            <path d="M3 12c1 0 3-1 3-3s-2-3-3-3-3 1-3 3 2 3 3 3"></path>
          </svg>
        </div>
        <h1 class="brand-name">TEK-UP_Plus</h1>
      </div>
      <h2 class="login-title">Connexion</h2>
      <p class="login-subtitle">Accédez à votre compte en toute sécurité</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">
          <span class="label-text">Adresse email</span>
          <span class="required-indicator">*</span>
        </label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="exemple@email.com"
            class="form-input"
            [class.error-input]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            [class.success-input]="loginForm.get('email')?.touched && loginForm.get('email')?.valid"
          />
        </div>
        <div class="error-messages" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <small class="error-text" *ngIf="loginForm.get('email')?.errors?.['required']">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            L'email est requis.
          </small>
          <small class="error-text" *ngIf="loginForm.get('email')?.errors?.['email']">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Format d'email invalide.
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <span class="label-text">Mot de passe</span>
          <span class="required-indicator">*</span>
        </label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <circle cx="12" cy="16" r="1"></circle>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Entrez votre mot de passe"
            class="form-input"
            [class.error-input]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            [class.success-input]="loginForm.get('password')?.touched && loginForm.get('password')?.valid"
          />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="error-messages" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <small class="error-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Le mot de passe est requis.
          </small>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-wrapper">
          <input type="checkbox" class="checkbox-input">
          <span class="checkbox-custom"></span>
          <span class="checkbox-label">Se souvenir de moi</span>
        </label>
        <a href="/auth/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="submit-button"
          [disabled]="loginForm.invalid"
          [class.loading]="isLoading"
        >
          <span class="button-text" [class.hidden]="isLoading">Se connecter</span>
          <div class="button-loader" *ngIf="isLoading">
            <div class="spinner"></div>
            <span>Connexion...</span>
          </div>
        </button>
      </div>

      <div class="form-messages">
        <div class="success-message" *ngIf="showSuccess">
          <div class="message-icon success-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20,6 9,17 4,12"></polyline>
            </svg>
          </div>
          <span>Connexion réussie ! Redirection en cours...</span>
        </div>

        <div class="error-message" *ngIf="error">
          <div class="message-icon error-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          </div>
          <span>{{ error }}</span>
        </div>
      </div>
    </form>

    <div class="divider">
      <span class="divider-text">NB</span>
    </div>

  

    <div class="login-footer">
      <p class="footer-text">
    
      </p>
      <div class="footer-links">
        <a href="/privacy" class="footer-link-small">Politique de confidentialité</a>
        <span class="separator">•</span>
        <a href="/terms" class="footer-link-small">Conditions d'utilisation</a>
      </div>
    </div>
  </div>
</div>
