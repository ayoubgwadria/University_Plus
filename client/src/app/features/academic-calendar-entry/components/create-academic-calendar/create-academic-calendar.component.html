<div class="create-academic-calendar-wrapper">
  <div class="create-academic-calendar-container">
    <div class="form-card">
      <div class="form-header">
        <h2>Créer une entrée du calendrier académique</h2>
        <p class="form-subtitle">Ajoutez une nouvelle période ou événement au calendrier académique.</p>
      </div>

      <form [formGroup]="calendarForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group">
          <label for="title">Titre <span class="required">*</span></label>
          <input id="title" type="text" formControlName="title" [class.invalid]="calendarForm.get('title')?.invalid && calendarForm.get('title')?.touched" />
          <div *ngIf="calendarForm.get('title')?.invalid && calendarForm.get('title')?.touched" class="error">
            Ce champ est requis.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Date de début <span class="required">*</span></label>
            <input id="startDate" type="date" formControlName="startDate" [class.invalid]="calendarForm.get('startDate')?.invalid && calendarForm.get('startDate')?.touched" />
            <div *ngIf="calendarForm.get('startDate')?.invalid && calendarForm.get('startDate')?.touched" class="error">
              Ce champ est requis.
            </div>
          </div>
          <div class="form-group">
            <label for="endDate">Date de fin <span class="required">*</span></label>
            <input id="endDate" type="date" formControlName="endDate" [class.invalid]="calendarForm.get('endDate')?.invalid && calendarForm.get('endDate')?.touched" />
            <div *ngIf="calendarForm.get('endDate')?.invalid && calendarForm.get('endDate')?.touched" class="error">
              Ce champ est requis.
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" rows="3"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" [disabled]="submitting || calendarForm.invalid">
            {{ submitting ? 'Création...' : 'Créer l\'entrée' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div *ngIf="submitting" class="loading-overlay">
    <div class="spinner"></div>
    <span>Création en cours...</span>
  </div>

  <!-- Toast Notification -->
  <div class="toast" [class.show]="showToast" [class]="toastType">
    <div class="toast-icon">
      <svg *ngIf="toastType === 'success'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20,6 9,17 4,12"></polyline>
      </svg>
      <svg *ngIf="toastType === 'error'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    <span class="toast-message">{{ toastMessage }}</span>
  </div>
</div>
