<div class="create-class-session-wrapper">
  <div class="create-class-session-container">
    <div class="form-card">
      <div class="form-header">
        <h2>Créer une séance</h2>
        <p class="form-subtitle">Remplissez les informations pour ajouter une nouvelle séance de classe.</p>
      </div>

      <form [formGroup]="classSessionForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group">
          <label for="subjectName">Nom de la matière <span class="required">*</span></label>
          <input id="subjectName" type="text" formControlName="subjectName" [class.invalid]="classSessionForm.get('subjectName')?.invalid && classSessionForm.get('subjectName')?.touched" />
          <div *ngIf="classSessionForm.get('subjectName')?.invalid && classSessionForm.get('subjectName')?.touched" class="error">
            Ce champ est requis.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date <span class="required">*</span></label>
            <input id="date" type="date" formControlName="date" [class.invalid]="classSessionForm.get('date')?.invalid && classSessionForm.get('date')?.touched" />
            <div *ngIf="classSessionForm.get('date')?.invalid && classSessionForm.get('date')?.touched" class="error">
              Ce champ est requis.
            </div>
          </div>
          <div class="form-group">
            <label for="startTime">Heure de début <span class="required">*</span></label>
            <input id="startTime" type="time" formControlName="startTime" [class.invalid]="classSessionForm.get('startTime')?.invalid && classSessionForm.get('startTime')?.touched" />
            <div *ngIf="classSessionForm.get('startTime')?.invalid && classSessionForm.get('startTime')?.touched" class="error">
              Ce champ est requis.
            </div>
          </div>
          <div class="form-group">
            <label for="endTime">Heure de fin <span class="required">*</span></label>
            <input id="endTime" type="time" formControlName="endTime" [class.invalid]="classSessionForm.get('endTime')?.invalid && classSessionForm.get('endTime')?.touched" />
            <div *ngIf="classSessionForm.get('endTime')?.invalid && classSessionForm.get('endTime')?.touched" class="error">
              Ce champ est requis.
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="room">Salle <span class="required">*</span></label>
          <input id="room" type="text" formControlName="room" [class.invalid]="classSessionForm.get('room')?.invalid && classSessionForm.get('room')?.touched" />
          <div *ngIf="classSessionForm.get('room')?.invalid && classSessionForm.get('room')?.touched" class="error">
            Ce champ est requis.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group checkbox-group">
            <label for="integratedClassroom">
              <input id="integratedClassroom" type="checkbox" formControlName="integratedClassroom" />
              Salle intégrée
            </label>
          </div>
          <div class="form-group">
            <label for="teacherId">ID Enseignant (optionnel)</label>
            <input id="teacherId" type="number" formControlName="teacherId" />
          </div>
          <div class="form-group">
            <label for="groupId">ID Groupe (optionnel)</label>
            <input id="groupId" type="number" formControlName="groupId" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" [disabled]="submitting || classSessionForm.invalid">
            {{ submitting ? 'Création...' : 'Créer la séance' }}
          </button>
        </div>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      </form>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div *ngIf="submitting" class="loading-overlay">
    <div class="spinner"></div>
    <span>Création en cours...</span>
  </div>

  <!-- Toast Notification -->
  <div class="toast" [class.show]="showToast" [class]="toastType">
    <div class="toast-icon">
      <svg *ngIf="toastType === 'success'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20,6 9,17 4,12"></polyline>
      </svg>
      <svg *ngIf="toastType === 'error'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    <span class="toast-message">{{ toastMessage }}</span>
  </div>
</div>
