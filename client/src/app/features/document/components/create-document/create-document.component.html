<div class="form-wrapper">
  <div class="form-container">
    <div class="form-header">
      <div class="header-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <h2 class="form-title">Créer un document</h2>
      <p class="form-subtitle">Remplissez les informations ci-dessous pour ajouter un document</p>
    </div>

    <form [formGroup]="documentForm" (ngSubmit)="onSubmit()" class="document-form">
      <!-- Title Field -->
      <div class="form-group">
        <label for="title" class="form-label">
          <span class="label-text">Titre</span>
          <span class="required-indicator">*</span>
        </label>
        <div class="input-wrapper" [class.error]="documentForm.get('title')?.invalid && documentForm.get('title')?.touched" [class.success]="documentForm.get('title')?.valid && documentForm.get('title')?.touched">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
          </div>
          <input
            id="title"
            type="text"
            formControlName="title"
            required
            class="form-input"
            placeholder="Titre du document"
            autocomplete="off"
          />
        </div>
        <div class="error-messages" *ngIf="documentForm.get('title')?.invalid && documentForm.get('title')?.touched">
          <small class="error-text" *ngIf="documentForm.get('title')?.errors?.['required']">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Le titre est requis.
          </small>
          <small class="error-text" *ngIf="documentForm.get('title')?.errors?.['minlength']">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Le titre doit contenir au moins 2 caractères.
          </small>
        </div>
      </div>

      <!-- File URL Field -->
      <div class="form-group">
        <label for="fileUrl" class="form-label">
          <span class="label-text">URL du fichier</span>
          <span class="required-indicator">*</span>
        </label>
        <div class="input-wrapper" [class.error]="documentForm.get('fileUrl')?.invalid && documentForm.get('fileUrl')?.touched" [class.success]="documentForm.get('fileUrl')?.valid && documentForm.get('fileUrl')?.touched">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16v16H4z"></path>
              <polyline points="8,16 12,12 16,16"></polyline>
            </svg>
          </div>
          <input
            id="fileUrl"
            type="text"
            formControlName="fileUrl"
            required
            class="form-input"
            placeholder="URL du fichier"
            autocomplete="off"
          />
        </div>
        <div class="error-messages" *ngIf="documentForm.get('fileUrl')?.invalid && documentForm.get('fileUrl')?.touched">
          <small class="error-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            L'URL du fichier est requise.
          </small>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button
          type="button"
          class="secondary-button"
          (click)="onReset()"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1,4 1,10 7,10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          Réinitialiser
        </button>
        <button
          type="submit"
          class="primary-button"
          [disabled]="documentForm.invalid || isSubmitting"
          [class.loading]="isSubmitting"
        >
          <span class="button-content" *ngIf="!isSubmitting">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
            Créer le document
          </span>
          <div class="loading-content" *ngIf="isSubmitting">
            <div class="spinner"></div>
            Création en cours...
          </div>
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div class="form-messages">
      <div class="success-message" *ngIf="successMessage">
        <div class="message-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22,4 12,14.01 9,11.01"></polyline>
          </svg>
        </div>
        <div class="message-content">
          <h4>Succès !</h4>
          <p>{{ successMessage }}</p>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <div class="message-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </div>
        <div class="message-content">
          <h4>Erreur</h4>
          <p>{{ errorMessage }}</p>
        </div>
      </div>
    </div>

    <!-- Form Progress -->
    <div class="form-progress">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getFormProgress()"></div>
      </div>
      <p class="progress-text">{{ getFormProgress() }}% complété</p>
    </div>
  </div>
</div>
